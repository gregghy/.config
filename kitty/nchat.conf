# Extra keymaps for the dedicated nchat kitty window.
# Loaded via: kitty --class nchat --config kitty.conf --config nchat.conf -e nchat
#
# Hyprland owns many Alt+key combos globally (Alt+C/Alt+Q close the window,
# Alt+S screenshot, Alt+2 workspace, ...) so nchat's Alt-letter bindings are
# unreachable. These maps emit the identical ESC<byte> sequence nchat binds
# for Alt actions, but triggered by Ctrl+Shift which Hyprland doesn't eat.

# chat management
map ctrl+shift+a send_text all \x1b\x61   # archive_chat   (was Alt+A)
map ctrl+shift+d send_text all \x1b\x64   # delete_chat    (was Alt+D)
map ctrl+shift+u send_text all \x1b\x75   # unread_chat    (was Alt+U)
map ctrl+shift+n send_text all \x1b\x6e   # select_contact (was Alt+N)
map ctrl+shift+2 send_text all \x1b\x32   # select_mention (was Alt+2)

# message actions (on the selected message)
map ctrl+shift+s send_text all \x1b\x73   # react          (was Alt+S)
map ctrl+shift+r send_text all \x1b\x72   # forward_msg    (was Alt+R)
map ctrl+shift+p send_text all \x1b\x70   # pin            (was Alt+P)
map ctrl+shift+q send_text all \x1b\x71   # jump_quoted    (was Alt+Q)
map ctrl+shift+w send_text all \x1b\x77   # open_msg       (was Alt+W)

# misc
map ctrl+shift+e send_text all \x1b\x65   # ext_edit       (was Alt+E)
map ctrl+shift+t send_text all \x1b\x74   # ext_call       (was Alt+T)
map ctrl+shift+i send_text all \x1b\x69   # auto_compose   (was Alt+I)
map ctrl+shift+x send_text all \x1b\x78   # cut            (was Alt+X)
map ctrl+shift+comma send_text all \x1b\x2c   # decrease_list_width (was Alt+,)
map ctrl+shift+period send_text all \x1b\x2e  # increase_list_width (was Alt+.)
map ctrl+shift+slash send_text all \x1b\x3f   # find_next    (was Alt+?)
map ctrl+shift+4 send_text all \x1b\x24       # spell        (was Alt+$)

# word-delete in the entry (was Alt+Backspace)
map ctrl+backspace send_text all \x1b\x7f
