include mocha.conf
font_family      CommitMono Nerd Font
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
# Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.8
remember_window_size no

# Clipboard: mouse-select auto-copies; ctrl+c copies selection or sends ^C
copy_on_select clipboard
map ctrl+c copy_or_interrupt

# nchat key passthroughs
map shift+enter send_text all \x1b\r
map ctrl+m send_text all \x1b\x6d
