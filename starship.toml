# Minimal gruvbox prompt: ~/path ❯ (+git branch when in a repo)

format = "$os$directory$git_branch$character"

palette = "gruvbox_dark"

[palettes.gruvbox_dark]
fg = "#ebdbb2"
bg = "#282828"
yellow = "#fabd2f"
orange = "#fe8019"
red = "#fb4934"
green = "#b8bb26"
aqua = "#8ec07c"
blue = "#83a598"
purple = "#d3869b"
gray = "#928374"

[directory]
style = "bold yellow"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "purple"
format = "[$symbol$branch]($style) "

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold aqua"

[os.symbols]
Arch = "林"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
