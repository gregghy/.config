onboarding = false
# Omarchy-style herdr config, adapted to this desktop's keymap.
# Modifier split: Alt = hyprland, Alt+Shift = herdr (no prefix needed).
# Only alt+shift+e is off-limits — hyprland owns it (-> kitty -e yazi).
# Mirrors hyprland's shapes: +arrows focus, +ctrl adds "move",
# +num switches tabs, +ctrl+num switches workspaces.

[theme]
# gruvbox = warm/brown palette (matches yazi + wallpapers)
# alternatives: terminal, catppuccin, tokyo-night, nord, dracula,
# one-dark, solarized, kanagawa, rose-pine, vesper
name = "gruvbox"

auto_switch = false
[theme.custom]
# Tab bar on the terminal background like tmux bg=default; dark text on the
# peach accent for the active tab
panel_bg = "reset"
surface_dim = "black"

[terminal]
# New panes/tabs/workspaces open in the current pane's cwd
new_cwd = "follow"

[keys]
# Kept for rare unbound actions; everyday use is all direct alt+shift chords.
prefix = "ctrl+space"

# Meta
reload_config = "alt+shift+ctrl+q"
help = "alt+shift+/"
detach = "alt+shift+d"
copy_mode = "alt+shift+`"

# Panes — focus mirrors hyprland's Alt+arrows
focus_pane_left = "alt+shift+left"
focus_pane_down = "alt+shift+down"
focus_pane_up = "alt+shift+up"
focus_pane_right = "alt+shift+right"

split_horizontal = ["alt+enter", "alt+shift+q"]
split_vertical = "alt+shift+enter"
close_pane = ["alt+shift+c", "alt+esc"]
zoom = "alt+shift+z"
last_pane = "alt+shift+;"
cycle_pane_next = "alt+shift+tab"
cycle_pane_previous = "alt+shift+ctrl+tab"
rename_pane = "alt+shift+o"

resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# Tabs — num/c/p/n/r/k mirror hyprland's workspace binds
switch_tab = ["alt+shift+1..9"]
new_tab = ["alt+shift+n", "alt+shift+t"]
rename_tab = "alt+shift+r"
close_tab = "alt+shift+k"
previous_tab = "alt+shift+ctrl+p"
next_tab = "alt+shift+ctrl+n"
move_tab_previous = "alt+shift+["
move_tab_next = "alt+shift+]"

# Workspaces — ctrl = "scope above tabs"
switch_workspace = ["alt+shift+ctrl+1..9"]
new_workspace = ["alt+shift+m", "alt+shift+ctrl+c"]
rename_workspace = "alt+shift+ctrl+r"
close_workspace = "alt+shift+ctrl+k"
previous_workspace = "alt+shift+ctrl+w"
next_workspace = "alt+shift+w"

# keys.command only fires on prefix chords in 0.9.5 (direct alt+shift chords
# don't dispatch — upstream #4448/#4586), so script-backed actions live on the
# prefix: smart split on prefix+q, pane swap on prefix+shift+arrows.
[[keys.command]]
key = "prefix+q"
type = "shell"
command = "/home/gregghy/.config/herdr/split-smart.py"

[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "/home/gregghy/.local/bin/herdr pane swap --direction left --current"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "/home/gregghy/.local/bin/herdr pane swap --direction right --current"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "/home/gregghy/.local/bin/herdr pane swap --direction up --current"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "/home/gregghy/.local/bin/herdr pane swap --direction down --current"

[ui]
accent = "peach"

# tmux-style dividers: single-line gaps, no outer frame, no scrollbars
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false

confirm_close = false
prompt_new_tab_name = false
mouse_capture = true

tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# Hyprland group bar / window title shows "host: workspace"
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

[ui.toast]
delivery = "system"
