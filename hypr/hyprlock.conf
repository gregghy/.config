general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(29, 32, 33, 0.55)
    blur_passes = 3
    blur_size = 5
    vibrancy = 0.5
    vibrancy_darkness = 0.5
}

# 木 rain — single fixed-width canvas, drops spawn at random x
label {
    monitor =
    text = cmd[update:120]/home/gregghy/.config/hypr/scripts/lock-rain
    color = rgba(131, 165, 152, 0.45)
    font_size = 20
    font_family = CommitMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

# frosted card
shape {
    monitor =
    size = 700, 780
    color = rgba(29, 32, 33, 0.93)
    rounding = 14
    border_size = 2
    border_color = rgba(60, 56, 54, 1.0)
    position = 0, 60
    halign = center
    valign = center
}

# ASCII 林 art (from the fastfetch logo, ANSI stripped)
label {
    monitor =
    text = cmd[update:3600000] sed 's/\x1b\[[0-9;]*m//g' /home/gregghy/.config/fastfetch/lin.txt
    color = rgba(131, 165, 152, 1.0)
    font_size = 18
    font_family = CommitMono Nerd Font
    position = 0, 225
    halign = center
    valign = center
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(235, 219, 178, 1.0)
    font_size = 46
    font_family = CommitMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a, %B %e")"
    color = rgba(235, 219, 178, 0.7)
    font_size = 20
    font_family = CommitMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# password box — rounded rect, unix-style asterisks
input-field {
    monitor =
    size = 520, 64
    outline_thickness = 3
    rounding = 10
    dots_size = 0.4
    dots_spacing = 0.5
    dots_center = true
    dots_text_format = *

    outer_color = rgba(60, 56, 54, 1.0)
    inner_color = rgba(40, 40, 40, 0.9)
    font_color = rgba(235, 219, 178, 1.0)

    check_color = rgba(184, 187, 38, 1.0)
    fail_color = rgba(251, 73, 52, 1.0)
    capslock_color = rgba(250, 189, 47, 1.0)

    placeholder_text = <i>> password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -135
    halign = center
    valign = center
}

# username under the input
label {
    monitor =
    text = $USER
    color = rgba(146, 131, 116, 0.9)
    font_size = 16
    font_family = CommitMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}

# nerd info under the input
label {
    monitor =
    text = cmd[update:60000] echo "$(uname -r | sed 's/-arch.*/-林UX/') · up $(uptime -p | sed 's/^up //')"
    color = rgba(146, 131, 116, 0.9)
    font_size = 16
    font_family = CommitMono Nerd Font
    position = 0, -230
    halign = center
    valign = center
}

# spinner, bottom-right
label {
    monitor =
    text = cmd[update:150]/home/gregghy/.config/hypr/scripts/lock-spinner
    color = rgba(146, 131, 116, 0.9)
    font_size = 16
    font_family = CommitMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# Battery, bottom-left
label {
    monitor =
    text = cmd[update:30000] echo "bat $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = rgba(146, 131, 116, 0.9)
    font_size = 16
    font_family = CommitMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}
