general {
    grace = 2
    no_fade_in = false
    expanded_conf = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(29, 32, 33, 0.5) # 1d202180
    blur_passes = 3 # 9x5 equivalent
    blur_size = 5
    vignette = 0.5
    vignette_darkness = 0.5
}

input-field {
    monitor =
    size = 400, 400 # Radius 200 * 2
    outline_thickness = 10
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    
    # Swaylock Colors Mapping
    outer_color = rgba(131, 165, 152, 1.0)     # ring-color gruvbox aqua (83a598)
    inner_color = rgba(40, 40, 40, 1.0)        # inside-color (282828)
    font_color = rgba(235, 219, 178, 1.0)      # text-color (ebdbb2)
    
    # State Colors
    check_color = rgba(184, 187, 38, 1.0)      # ring-ver-color (b8bb26)
    fail_color = rgba(251, 73, 52, 1.0)       # ring-wrong-color (fb4934)
    capslock_color = rgba(250, 189, 47, 1.0)   # yellow when caps on (fabd2f)
    
    # Feedback
    placeholder_text = <i>Input Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>       # show-failed-attempts
    
    position = 0, 0
    halign = center
    valign = center
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(235, 219, 178, 1.0)
    font_size = 64
    font_family = CommitMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a, %B %e")"
    color = rgba(235, 219, 178, 0.8)
    font_size = 24
    font_family = CommitMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# 林 logo inside the ring
image {
    monitor =
    path = /home/gregghy/.config/fastfetch/lin.png
    size = 110
    rounding = -1
    position = 0, -95
    halign = center
    valign = center
}

# 林ux branding
label {
    monitor =
    text = 林ux
    color = rgba(131, 165, 152, 0.9)
    font_size = 28
    font_family = Noto Sans CJK JP
    position = 0, 80
    halign = center
    valign = bottom
}

# Battery, bottom-left
label {
    monitor =
    text = cmd[update:30000] echo "bat $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = rgba(146, 131, 116, 0.9)
    font_size = 16
    font_family = CommitMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}
