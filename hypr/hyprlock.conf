general {
    grace = 2
    no_fade_in = false
    expanded_conf = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(31, 29, 46, 0.5) # 1f1d2e80
    blur_passes = 3 # 9x5 equivalent
    blur_size = 5
    vignette = 0.5
    vignette_darkness = 0.5
}

input-field {
    monitor =
    size = 400, 400 # Radius 200 * 2
    outline_thickness = 20
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    
    # Swaylock Colors Mapping
    outer_color = rgba(25, 23, 36, 1.0)        # ring-color (191724)
    inner_color = rgba(31, 29, 46, 1.0)        # inside-color (1f1d2e)
    font_color = rgba(224, 222, 244, 1.0)      # text-color (e0def4)
    
    # State Colors
    check_color = rgba(235, 111, 146, 1.0)     # ring-ver-color (eb6f92)
    fail_color = rgba(49, 116, 143, 1.0)      # ring-wrong-color (31748f)
    capslock_color = -1                        # Keep default or specific
    
    # Feedback
    placeholder_text = <i>Input Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>       # show-failed-attempts
    
    position = 0, 0
    halign = center
    valign = center
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(224, 222, 244, 1.0)
    font_size = 64
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a, %B %e")"
    color = rgba(224, 222, 244, 0.8)
    font_size = 24
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}

# 林ux branding
label {
    monitor =
    text = 林ux
    color = rgba(156, 207, 216, 0.9)
    font_size = 28
    font_family = Noto Sans CJK JP
    position = 0, 80
    halign = center
    valign = bottom
}
